# Public entry point.
#   /api/, /oauth/, /.well-known/oauth-authorization-server -> backend
#   /mcp, /.well-known/oauth-protected-resource            -> MCP server
#   /media/                                                 -> uploaded media (Meta fetches these to publish)
#   everything else                                         -> frontend SPA
# Every hostname (e.g. frontend.* and mcp.*) is served the same way.

# Like the default "combined" format, but without the query string: MCP connector
# URLs carry personal tokens (/mcp?token=...).
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    client_max_body_size 110m;
    access_log /var/log/nginx/access.log no_query;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        proxy_pass http://backend:8000;
        # Claude generation, hashtag research and first-time model loading can be slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Token introspection is for the MCP server on the internal network only.
    location = /oauth/introspect { return 404; }

    location /oauth/ {
        proxy_pass http://backend:8000;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend:8000;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8765;
    }

    location /mcp {
        proxy_pass http://mcp:8765;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /media/ {
        alias /data/media/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
